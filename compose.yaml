services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-build-placeholder}
    image: luna-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      OTP_ENCRYPTION_SECRET: ${OTP_ENCRYPTION_SECRET:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SERVICE_NAME: luna-web
      TRUST_PROXY: ${TRUST_PROXY:-true}
      APP_REVISION: ${APP_REVISION:-local}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const port=process.env.PORT||'3000';fetch('http://127.0.0.1:'+port+'/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    networks: [edge, backplane]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: luna-worker:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_INTERACTIVE_MESSAGES: ${EVOLUTION_INTERACTIVE_MESSAGES:-false}
      HANDOFF_NOTIFICATION_PHONE: ${HANDOFF_NOTIFICATION_PHONE:?configure o numero da doutora}
      OTP_ENCRYPTION_SECRET: ${OTP_ENCRYPTION_SECRET:-}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WORKER_HEALTH_PORT: 3001
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
      WORKER_DAILY_SUMMARY_HOUR: ${WORKER_DAILY_SUMMARY_HOUR:-8}
      WORKER_CALENDAR_SYNC_INTERVAL_MS: ${WORKER_CALENDAR_SYNC_INTERVAL_MS:-60000}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:?configure Google Calendar service account}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:?configure Google Calendar private key}
      WORKER_RECIPIENT_POLICY: ${WORKER_RECIPIENT_POLICY:?configure all or allowlist}
      WORKER_ALLOWED_RECIPIENTS: ${WORKER_ALLOWED_RECIPIENTS:-}
      SERVICE_NAME: luna-worker
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_COLOR: ${LOG_COLOR:-never}
      APP_REVISION: ${APP_REVISION:-local}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    networks: [backplane]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}"]
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    secrets: [metrics_token]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [backplane]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  edge:
  backplane:

secrets:
  metrics_token:
    external: true
