name: luna-worker

services:
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:?configure APP_REVISION}
    image: ${WORKER_IMAGE_REPOSITORY:-luna-worker}:${IMAGE_TAG:?configure IMAGE_TAG}
    init: true
    restart: unless-stopped
    env_file:
      - ${WORKER_ENV_FILE:-./worker.env}
    environment:
      NODE_ENV: production
      SERVICE_NAME: luna-worker
      WORKER_HEALTH_PORT: "3001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    cpus: ${WORKER_CPU_LIMIT:-0.75}
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [worker]

networks:
  worker:
    name: luna-worker
