name: luna-web

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?configure NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?configure NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        APP_REVISION: ${APP_REVISION:?configure APP_REVISION}
    image: ${WEB_IMAGE_REPOSITORY:-luna-web}:${IMAGE_TAG:?configure IMAGE_TAG}
    init: true
    restart: unless-stopped
    env_file:
      - ${WEB_ENV_FILE:-./web.env}
    environment:
      NODE_ENV: production
      SERVICE_NAME: luna-web
      TRUST_PROXY: "true"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    cpus: ${WEB_CPU_LIMIT:-1.0}
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [web]

networks:
  web:
    name: luna-web
